name: Release

# Builds agp for macOS and Linux (static, so it runs on any distribution and
# in WSL) and publishes the binaries on the GitHub release of the tag.
# `scripts/release.sh X.Y.Z` pushes the tag; scripts/install.sh downloads
# what this publishes.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag to build again, e.g. v0.2.0
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, runs: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, runs: true }
          - { target: aarch64-apple-darwin, os: macos-latest, runs: true }
          - { target: x86_64-apple-darwin, os: macos-latest, runs: false }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install musl
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools
      - name: The tag matches the version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "agent-prism") | .version')
          [ "v$version" = "$TAG" ] || { echo "::error::tag $TAG but Cargo.toml says $version"; exit 1; }
      - run: cargo build --profile dist --locked -p agent-prism --target ${{ matrix.target }}
      - name: Run it
        if: matrix.runs
        run: target/${{ matrix.target }}/dist/agp --version
      - run: sh scripts/package.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agp-${{ matrix.target }}
          path: dist/agp-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum agp-*.tar.gz | tee SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/agp-*.tar.gz
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --verify-tag --title "agent-prism ${TAG#v}" --generate-notes
          gh release upload "$TAG" dist/agp-*.tar.gz dist/SHA256SUMS --clobber
